<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booth 1 Admin | Stock Control</title>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #0a0705; 
            color: white; 
            padding: 20px; 
            text-align: center; 
            margin: 0;
        }
        h1 { color: #c5a059; font-size: 1.5rem; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 2px; }
        
        .card { 
            background: #16110e; 
            border: 1px solid rgba(197, 160, 89, 0.35); 
            padding: 24px; 
            margin-bottom: 24px; 
            border-radius: 8px; 
        }
        .card h2 { margin: 0; font-size: 1.2rem; color: #e6c88b; }
        
        .count { 
            font-size: 4rem; 
            font-weight: bold; 
            margin: 10px 0; 
            color: #ffffff;
        }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        button { 
            flex: 1; 
            padding: 20px; 
            font-size: 2rem; 
            font-weight: bold;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        
        .btn-minus { background: #d9534f; color: white; }
        .btn-plus { background: #4caf50; color: white; }
    </style>
</head>
<body>

    <h1>Indonesia Admin Panel</h1>

    <!-- Nasi Goreng Control -->
    <div class="card">
        <h2>🍛 Nasi Goreng</h2>
        <div class="count" id="nasi-count">50</div>
        <div class="btn-group">
            <button class="btn-minus" onclick="updateStock('nasi', -1)">−</button>
            <button class="btn-plus" onclick="updateStock('nasi', 1)">+</button>
        </div>
    </div>

    <!-- Wedang Jahe Control -->
    <div class="card">
        <h2>🍵 Wedang Jahe</h2>
        <div class="count" id="wedang-count">50</div>
        <div class="btn-group">
            <button class="btn-minus" onclick="updateStock('wedang', -1)">−</button>
            <button class="btn-plus" onclick="updateStock('wedang', 1)">+</button>
        </div>
    </div>

    <!-- Firebase SDK & Live Sync Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Your Web App's Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAdUDRkUqEamY_lscdAeSNlhBZWs-EgNvU",
            authDomain: "basil--n-bowl-kiosk-system.firebaseapp.com",
            databaseURL: "https://basil--n-bowl-kiosk-system-default-rtdb.firebaseio.com",
            projectId: "basil--n-bowl-kiosk-system",
            storageBucket: "basil--n-bowl-kiosk-system.firebasestorage.app",
            messagingSenderId: "282044269599",
            appId: "1:282044269599:web:299b5406ef8ab9e27a012a",
            measurementId: "G-45ZJB5EE0W"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Track current stocks locally to do math
        let currentStocks = { nasi: 50, wedang: 50 };

        // Listen for live updates from Firebase to display on screen
        const stocksRef = ref(db, 'stocks');
        onValue(stocksRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentStocks = data;
                document.getElementById('nasi-count').innerText = currentStocks.nasi !== undefined ? currentStocks.nasi : 50;
                document.getElementById('wedang-count').innerText = currentStocks.wedang !== undefined ? currentStocks.wedang : 50;
            }
        });

        // Attach function to window so HTML buttons can trigger it
        window.updateStock = function(item, change) {
            let newCount = (currentStocks[item] !== undefined ? currentStocks[item] : 50) + change;
            
            // Prevent going below 0
            if (newCount < 0) newCount = 0; 
            
            // Push new number to Firebase
            set(ref(db, 'stocks/' + item), newCount);
        };
    </script>

</body>
</html>
