<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booth 1 Admin | Stock Control</title>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #0a0705; 
            color: white; 
            padding: 20px; 
            text-align: center; 
            margin: 0;
        }
        h1 { color: #c5a059; font-size: 1.5rem; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 2px; }
        
        .card { 
            background: #16110e; 
            border: 1px solid rgba(197, 160, 89, 0.35); 
            padding: 24px; 
            margin-bottom: 24px; 
            border-radius: 8px; 
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .card h2 { margin: 0; font-size: 1.2rem; color: #e6c88b; }
        
        .count { 
            font-size: 3.8rem; 
            font-weight: bold; 
            margin: 5px 0; 
            color: #ffffff;
        }

        /* Small Box for Samples Served */
        .served-box {
            display: inline-block;
            background: rgba(197, 160, 89, 0.12);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: #e6c88b;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 16px; }
        button { 
            flex: 1; 
            padding: 16px; 
            font-size: 1.8rem; 
            font-weight: bold;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        
        .btn-minus { background: #d9534f; color: white; }
        .btn-plus { background: #4caf50; color: white; }

        /* Direct Input Control Styling */
        .set-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .set-group input {
            background: #0a0705;
            border: 1px solid rgba(197, 160, 89, 0.5);
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            width: 130px;
            text-align: center;
            outline: none;
        }

        .set-group input:focus {
            border-color: #c5a059;
        }

        .btn-set {
            background: #c5a059;
            color: #0a0705;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 12px 18px;
            flex: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>Admin Panel</h1>

    <!-- Nasi Goreng Control -->
    <div class="card">
        <h2>🍛 Nasi Goreng</h2>
        <div class="count" id="nasi-count">100</div>
        
        <!-- Samples Served Display Box -->
        <div class="served-box" id="nasi-served">🍽️ Samples Served: 0 / 100</div>

        <div class="btn-group">
            <button class="btn-minus" onclick="updateStock('nasi', -1)">−</button>
            <button class="btn-plus" onclick="updateStock('nasi', 1)">+</button>
        </div>
        <div class="set-group">
            <input type="number" id="nasi-input" placeholder="Enter stock" min="0">
            <button class="btn-set" onclick="setExactStock('nasi')">Set Stock</button>
        </div>
    </div>

    <!-- Wedang Jahe Control -->
    <div class="card">
        <h2>🍵 Wedang Jahe</h2>
        <div class="count" id="wedang-count">100</div>

        <!-- Samples Served Display Box -->
        <div class="served-box" id="wedang-served">🍽️ Samples Served: 0 / 100</div>

        <div class="btn-group">
            <button class="btn-minus" onclick="updateStock('wedang', -1)">−</button>
            <button class="btn-plus" onclick="updateStock('wedang', 1)">+</button>
        </div>
        <div class="set-group">
            <input type="number" id="wedang-input" placeholder="Enter stock" min="0">
            <button class="btn-set" onclick="setExactStock('wedang')">Set Stock</button>
        </div>
    </div>

    <!-- Firebase SDK & Live Sync Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Your Web App's Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAdUDRkUqEamY_lscdAeSNlhBZWs-EgNvU",
            authDomain: "basil--n-bowl-kiosk-system.firebaseapp.com",
            databaseURL: "https://basil--n-bowl-kiosk-system-default-rtdb.firebaseio.com",
            projectId: "basil--n-bowl-kiosk-system",
            storageBucket: "basil--n-bowl-kiosk-system.firebasestorage.app",
            messagingSenderId: "282044269599",
            appId: "1:282044269599:web:299b5406ef8ab9e27a012a",
            measurementId: "G-45ZJB5EE0W"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Local tracking
        let currentStocks = { nasi: 100, wedang: 100 };

        // Realtime Listener
        const stocksRef = ref(db, 'stocks');
        onValue(stocksRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentStocks = data;
                
                const nasiStock = currentStocks.nasi !== undefined ? currentStocks.nasi : 100;
                const wedangStock = currentStocks.wedang !== undefined ? currentStocks.wedang : 100;

                // Update Remaining Stock UI
                document.getElementById('nasi-count').innerText = nasiStock;
                document.getElementById('wedang-count').innerText = wedangStock;

                // Calculate Served Samples (Clamped between 0 and 100)
                const nasiServed = Math.max(0, Math.min(100, 100 - nasiStock));
                const wedangServed = Math.max(0, Math.min(100, 100 - wedangStock));

                // Update Served UI Boxes
                document.getElementById('nasi-served').innerText = `🍽️ Samples Served: ${nasiServed} / 100`;
                document.getElementById('wedang-served').innerText = `🍽️ Samples Served: ${wedangServed} / 100`;
            }
        });

        // Increment / Decrement
        window.updateStock = function(item, change) {
            let newCount = (currentStocks[item] !== undefined ? currentStocks[item] : 100) + change;
            if (newCount < 0) newCount = 0; 
            set(ref(db, 'stocks/' + item), newCount);
        };

        // Set Exact Custom Stock Value
        window.setExactStock = function(item) {
            const inputEl = document.getElementById(item + '-input');
            const val = parseInt(inputEl.value, 10);
            if (!isNaN(val) && val >= 0) {
                set(ref(db, 'stocks/' + item), val);
                inputEl.value = '';
            }
        };
    </script>

</body>
</html>
