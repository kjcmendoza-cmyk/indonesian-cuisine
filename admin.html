<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Esteemed Royal Dining</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0705;
            --card-bg: #16110e;
            --gold-primary: #c5a059;
            --text-main: #f4efea;
            --text-muted: #b5a89e;
            --border-gold: rgba(197, 160, 89, 0.35);
            --safe-green: #4caf50;
            --warn-red: #d9534f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
        }

        .header {
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-gold);
        }

        .header h1 {
            color: var(--gold-primary);
            font-size: 1.8rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            padding: 24px;
        }

        .admin-card h2 {
            font-size: 1.2rem;
            color: var(--gold-primary);
            margin-bottom: 16px;
        }

        .stock-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            background: rgba(10, 7, 5, 0.8);
            border: 1px solid var(--gold-primary);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--gold-primary);
            color: var(--bg-dark);
        }

        button.btn-danger {
            border-color: var(--warn-red);
            color: var(--warn-red);
        }

        button.btn-danger:hover {
            background: var(--warn-red);
            color: white;
        }

        /* Custom Modal Dialog */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 28px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-card h3 {
            color: var(--gold-primary);
            font-size: 1.25rem;
            margin-bottom: 6px;
        }

        .modal-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .modal-card input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(10, 7, 5, 0.9);
            border: 1px solid var(--border-gold);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .modal-card input[type="number"]:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px rgba(197, 160, 89, 0.3);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-primary {
            background: var(--gold-primary);
            color: var(--bg-dark);
            border: 1px solid var(--gold-primary);
        }

        .btn-primary:hover {
            background: #d4b26f;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Reactions Section */
        .reactions-container {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            padding: 24px;
            max-height: 400px;
            overflow-y: auto;
        }

        .reaction-item {
            padding: 12px;
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reaction-text {
            font-weight: 600;
            color: var(--gold-primary);
        }

        .reaction-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dashboard Control Panel</h1>
        <p style="color: var(--text-muted);">Manage inventory and view live audience feedback.</p>
    </div>

    <!-- Stock Controls -->
    <div class="dashboard-grid">
        <!-- Nasi Goreng -->
        <div class="admin-card">
            <h2>Nasi Goreng Stock</h2>
            <div class="stock-value" id="admin-nasi-val">--</div>
            <div class="controls">
                <button onclick="updateStock('nasi', -1)">- 1</button>
                <button onclick="updateStock('nasi', 1)">+ 1</button>
                <button onclick="setCustomStock('nasi')">Set Value</button>
            </div>
        </div>

        <!-- Wedang Jahe -->
        <div class="admin-card">
            <h2>Wedang Jahe Stock</h2>
            <div class="stock-value" id="admin-wedang-val">--</div>
            <div class="controls">
                <button onclick="updateStock('wedang', -1)">- 1</button>
                <button onclick="updateStock('wedang', 1)">+ 1</button>
                <button onclick="setCustomStock('wedang')">Set Value</button>
            </div>
        </div>

        <!-- Krupuk -->
        <div class="admin-card">
            <h2>Krupuk Stock</h2>
            <div class="stock-value" id="admin-krupuk-val">--</div>
            <div class="controls">
                <button onclick="updateStock('krupuk', -1)">- 1</button>
                <button onclick="updateStock('krupuk', 1)">+ 1</button>
                <button onclick="setCustomStock('krupuk')">Set Value</button>
            </div>
        </div>
    </div>

    <!-- Live Reactions -->
    <div class="reactions-container">
        <div class="flex-between">
            <h2>Live Audience Reactions</h2>
            <button class="btn-danger" onclick="clearReactions()">Clear Logs</button>
        </div>
        <div id="reactions-list">
            <p style="color: var(--text-muted);">Waiting for reactions...</p>
        </div>
    </div>

    <!-- Styled Stock Input Modal -->
    <div class="modal-overlay" id="stock-modal">
        <div class="modal-card">
            <h3 id="modal-title">Set Stock Value</h3>
            <p id="modal-desc">Enter the new total quantity for this item.</p>
            <input type="number" id="modal-stock-input" min="0" placeholder="0">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="confirmCustomStock()">Update Stock</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdUDRkUqEamY_lscdAeSNlhBZWs-EgNvU",
            authDomain: "basil--n-bowl-kiosk-system.firebaseapp.com",
            databaseURL: "https://basil--n-bowl-kiosk-system-default-rtdb.firebaseio.com",
            projectId: "basil--n-bowl-kiosk-system",
            storageBucket: "basil--n-bowl-kiosk-system.firebasestorage.app",
            messagingSenderId: "282044269599",
            appId: "1:282044269599:web:299b5406ef8ab9e27a012a",
            measurementId: "G-45ZJB5EE0W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State tracking for modal input
        let activeItemKey = null;

        const itemDisplayNames = {
            nasi: 'Nasi Goreng',
            wedang: 'Wedang Jahe',
            krupuk: 'Krupuk'
        };

        // --- INVENTORY MANAGEMENT ---
        const stocksRef = ref(db, 'stocks');
        
        onValue(stocksRef, (snapshot) => {
            const data = snapshot.val() || { nasi: 50, wedang: 50, krupuk: 50 };
            
            document.getElementById('admin-nasi-val').innerText = data.nasi !== undefined ? data.nasi : 50;
            document.getElementById('admin-wedang-val').innerText = data.wedang !== undefined ? data.wedang : 50;
            document.getElementById('admin-krupuk-val').innerText = data.krupuk !== undefined ? data.krupuk : 50;
            
            // Expose current data globally for the update buttons
            window.currentStocks = data;
        });

        window.updateStock = async function(item, amount) {
            const currentVal = window.currentStocks && window.currentStocks[item] !== undefined 
                ? window.currentStocks[item] 
                : 50;
            let newVal = currentVal + amount;
            if (newVal < 0) newVal = 0; // Prevent negative stock
            
            await set(ref(db, 'stocks/' + item), newVal);
        };

        // Modal Functions
        window.setCustomStock = function(item) {
            activeItemKey = item;
            const currentVal = window.currentStocks && window.currentStocks[item] !== undefined 
                ? window.currentStocks[item] 
                : 0;

            const name = itemDisplayNames[item] || item;
            document.getElementById('modal-title').innerText = `Set ${name} Stock`;
            document.getElementById('modal-desc').innerText = `Enter the new stock value for ${name}.`;
            
            const inputEl = document.getElementById('modal-stock-input');
            inputEl.value = currentVal;

            const modal = document.getElementById('stock-modal');
            modal.classList.add('active');
            
            setTimeout(() => {
                inputEl.focus();
                inputEl.select();
            }, 50);
        };

        window.closeModal = function() {
            document.getElementById('stock-modal').classList.remove('active');
            activeItemKey = null;
        };

        window.confirmCustomStock = async function() {
            if (!activeItemKey) return;

            const inputEl = document.getElementById('modal-stock-input');
            const inputVal = inputEl.value.trim();

            if (inputVal !== "" && !isNaN(inputVal)) {
                const newVal = parseInt(inputVal, 10);
                if (newVal >= 0) {
                    await set(ref(db, 'stocks/' + activeItemKey), newVal);
                }
            }
            window.closeModal();
        };

        // Listen for 'Enter' key inside modal input
        document.getElementById('modal-stock-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                window.confirmCustomStock();
            } else if (e.key === 'Escape') {
                window.closeModal();
            }
        });

        // Close modal when clicking outside modal box
        document.getElementById('stock-modal').addEventListener('click', (e) => {
            if (e.target.id === 'stock-modal') {
                window.closeModal();
            }
        });

        // --- REACTIONS LOG MANAGEMENT ---
        const reactionsRef = ref(db, 'booth_reactions');
        
        onValue(reactionsRef, (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById('reactions-list');
            
            if (!data) {
                listEl.innerHTML = '<p style="color: var(--text-muted);">No reactions recorded yet.</p>';
                return;
            }

            listEl.innerHTML = '';
            
            // Convert object to array and sort by newest first
            const reactionsArr = Object.values(data).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            reactionsArr.forEach(item => {
                const dateObj = new Date(item.timestamp);
                const timeString = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                
                const div = document.createElement('div');
                div.className = 'reaction-item';
                div.innerHTML = `
                    <span class="reaction-text">"${item.reaction}"</span>
                    <span class="reaction-time">${timeString}</span>
                `;
                listEl.appendChild(div);
            });
        });

        window.clearReactions = async function() {
            if(confirm("Are you sure you want to delete all reaction logs?")) {
                await remove(ref(db, 'booth_reactions'));
            }
        };
    </script>
</body>
</html>
